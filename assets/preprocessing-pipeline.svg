<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540" role="img" aria-labelledby="t d" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Preprocessing pipeline</title>
<desc id="d">ColumnTransformer with a numerical branch (median imputation, standard scaling) and a categorical branch (most frequent imputation, one-hot encoding).</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
<linearGradient id="gi" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#4338ca"/></linearGradient>
<linearGradient id="gt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
<linearGradient id="ga" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#b45309"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/></filter>
</defs>
<rect width="1100" height="540" rx="18" fill="#0f172a"/>
<text x="550" y="44" font-size="24" fill="#e2e8f0" font-weight="800" text-anchor="middle" >Preprocessing Pipeline</text>
<text x="550" y="68" font-size="14" fill="#94a3b8" font-weight="400" text-anchor="middle" >Leakage-safe transformations that travel with the model</text>
<rect x="24" y="215" width="150" height="90" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" filter="url(#sh)"/>
<text x="99.0" y="257.0" font-size="17" fill="#e2e8f0" font-weight="700" text-anchor="middle" >Input features</text>
<text x="99.0" y="277.0" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="middle" >X  (no targets)</text>
<rect x="200" y="100" width="600" height="400" rx="18" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="220" y="88" width="170" height="26" rx="13" fill="#0f172a" stroke="#475569"/>
<text x="305" y="106" font-size="13" fill="#cbd5e1" font-weight="700" text-anchor="middle" >ColumnTransformer</text>
<text x="215" y="148" font-size="12" fill="#a5b4fc" font-weight="700" text-anchor="start" letter-spacing="2">NUMERICAL FEATURES</text>
<rect x="215" y="160" width="170" height="80" rx="12" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" filter="url(#sh)"/>
<text x="300.0" y="197.0" font-size="17" fill="#e2e8f0" font-weight="700" text-anchor="middle" >Numerical</text>
<text x="300.0" y="217.0" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="middle" >scores, counts, ratios</text>
<rect x="410" y="160" width="170" height="80" rx="12" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" filter="url(#sh)"/>
<text x="495.0" y="197.0" font-size="17" fill="#e2e8f0" font-weight="700" text-anchor="middle" >Impute</text>
<text x="495.0" y="217.0" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="middle" >Imputer · median</text>
<rect x="605" y="160" width="170" height="80" rx="12" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" filter="url(#sh)"/>
<text x="690.0" y="197.0" font-size="17" fill="#e2e8f0" font-weight="700" text-anchor="middle" >Scale</text>
<text x="690.0" y="217.0" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="middle" >StandardScaler</text>
<polyline points="385,200 410,200" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#ar)"/>
<polyline points="580,200 605,200" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#ar)"/>
<text x="215" y="318" font-size="12" fill="#5eead4" font-weight="700" text-anchor="start" letter-spacing="2">CATEGORICAL FEATURES</text>
<rect x="215" y="330" width="170" height="80" rx="12" fill="#1e293b" stroke="#14b8a6" stroke-width="1.5" filter="url(#sh)"/>
<text x="300.0" y="367.0" font-size="17" fill="#e2e8f0" font-weight="700" text-anchor="middle" >Categorical</text>
<text x="300.0" y="387.0" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="middle" >labels, groups, flags</text>
<rect x="410" y="330" width="170" height="80" rx="12" fill="#1e293b" stroke="#14b8a6" stroke-width="1.5" filter="url(#sh)"/>
<text x="495.0" y="367.0" font-size="17" fill="#e2e8f0" font-weight="700" text-anchor="middle" >Impute</text>
<text x="495.0" y="387.0" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="middle" >Imputer · most_frequent</text>
<rect x="605" y="330" width="170" height="80" rx="12" fill="#1e293b" stroke="#14b8a6" stroke-width="1.5" filter="url(#sh)"/>
<text x="690.0" y="367.0" font-size="17" fill="#e2e8f0" font-weight="700" text-anchor="middle" >Encode</text>
<text x="690.0" y="387.0" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="middle" >OneHotEncoder</text>
<text x="690" y="418" font-size="11" fill="#5eead4" font-weight="400" text-anchor="middle" >handle_unknown='ignore'</text>
<polyline points="385,370 410,370" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#ar)"/>
<polyline points="580,370 605,370" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#ar)"/>
<polyline points="775,200 815,200 815,260 846,260" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#ar)"/>
<polyline points="775,370 815,370 815,260" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round"/>
<polyline points="174,260 200,260" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#ar)"/>
<rect x="848" y="215" width="230" height="90" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" filter="url(#sh)"/>
<text x="963.0" y="257.0" font-size="17" fill="#e2e8f0" font-weight="700" text-anchor="middle" >Estimator</text>
<text x="963.0" y="277.0" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="middle" >model or ensemble</text>
<text x="963" y="330" font-size="13" fill="#cbd5e1" font-weight="600" text-anchor="middle" >Pipeline(preprocessor → model)</text>
<text x="963" y="352" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="middle" >saved as one .joblib file</text>
<text x="550" y="524" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="middle" >The fitted preprocessor is stored inside the exported pipeline, so training and inference apply identical transformations.</text>
</svg>
