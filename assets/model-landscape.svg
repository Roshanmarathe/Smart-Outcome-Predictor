<text x="54" y="544" font-size="18" fill="#e2e8f0" font-weight="700" text-anchor="start" >Soft Voting</text>
<text x="250" y="544" font-size="14" fill="#cbd5e1" font-weight="400" text-anchor="start" >Averages predicted class probabilities</text>
<circle cx="830" cy="538" r="14" fill="#6366f1" fill-opacity="0.22" stroke="#6366f1" stroke-width="1.5"/>
