<text x="250" y="614" font-size="14" fill="#cbd5e1" font-weight="400" text-anchor="start" >A meta-model learns to combine base learners</text>
<circle cx="830" cy="608" r="14" fill="#6366f1" fill-opacity="0.22" stroke="#6366f1" stroke-width="1.5"/>
