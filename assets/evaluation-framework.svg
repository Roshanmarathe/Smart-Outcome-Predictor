<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-labelledby="t d" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Evaluation framework</title>
<desc id="d">Classification metrics (accuracy, precision, recall, F1, ROC-AUC) and regression metrics (MAE, RMSE, R-squared) with the selection metrics highlighted.</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
<linearGradient id="gi" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#4338ca"/></linearGradient>
<linearGradient id="gt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
<linearGradient id="ga" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#b45309"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/></filter>
</defs>
<rect width="1100" height="600" rx="18" fill="#0f172a"/>
<text x="550" y="46" font-size="24" fill="#e2e8f0" font-weight="800" text-anchor="middle" >Evaluation Framework</text>
<text x="550" y="70" font-size="14" fill="#94a3b8" font-weight="400" text-anchor="middle" >Different targets, different yardsticks</text>
<rect x="30" y="94" width="510" height="44" rx="10" fill="url(#gi)"/>
<text x="285" y="122" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle" letter-spacing="1">CLASSIFICATION  ·  positive class = Completed (1)</text>
<rect x="560" y="94" width="510" height="44" rx="10" fill="url(#gt)"/>
<text x="815" y="122" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle" letter-spacing="1">REGRESSION  ·  target = final_score</text>
<rect x="30" y="152" width="510" height="70" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
<rect x="30" y="152" width="6" height="70" rx="3" fill="#6366f1"/>
<text x="56" y="183" font-size="19" fill="#e2e8f0" font-weight="800" text-anchor="start" >Accuracy</text>
<text x="56" y="205" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="start" >Share of all predictions that are correct</text>
<rect x="30" y="234" width="510" height="70" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
<rect x="30" y="234" width="6" height="70" rx="3" fill="#6366f1"/>
<text x="56" y="265" font-size="19" fill="#e2e8f0" font-weight="800" text-anchor="start" >Precision</text>
<text x="56" y="287" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="start" >Of predicted Completed, how many truly completed</text>
<rect x="30" y="316" width="510" height="70" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
<rect x="30" y="316" width="6" height="70" rx="3" fill="#6366f1"/>
<text x="56" y="347" font-size="19" fill="#e2e8f0" font-weight="800" text-anchor="start" >Recall</text>
<text x="56" y="369" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="start" >Of actual Completed, how many were found</text>
<rect x="30" y="398" width="510" height="70" rx="12" fill="#1e293b" stroke="#6366f1" stroke-width="2.2"/>
<rect x="30" y="398" width="6" height="70" rx="3" fill="#6366f1"/>
<text x="56" y="429" font-size="19" fill="#e2e8f0" font-weight="800" text-anchor="start" >F1 Score</text>
<text x="56" y="451" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="start" >Harmonic mean of precision and recall</text>
<rect x="368" y="414" width="152" height="26" rx="13" fill="#6366f1"/>
<text x="444" y="432" font-size="10.5" fill="#0b1220" font-weight="800" text-anchor="middle" letter-spacing="0.6">SELECTION METRIC</text>
<rect x="30" y="480" width="510" height="70" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
<rect x="30" y="480" width="6" height="70" rx="3" fill="#6366f1"/>
<text x="56" y="511" font-size="19" fill="#e2e8f0" font-weight="800" text-anchor="start" >ROC-AUC</text>
<text x="56" y="533" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="start" >Ranking quality across all thresholds</text>
<rect x="560" y="152" width="510" height="70" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
<rect x="560" y="152" width="6" height="70" rx="3" fill="#14b8a6"/>
<text x="586" y="183" font-size="19" fill="#e2e8f0" font-weight="800" text-anchor="start" >MAE</text>
<text x="586" y="205" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="start" >Average absolute error in score points  ·  lower is better</text>
<rect x="560" y="234" width="510" height="70" rx="12" fill="#1e293b" stroke="#14b8a6" stroke-width="2.2"/>
<rect x="560" y="234" width="6" height="70" rx="3" fill="#14b8a6"/>
<text x="586" y="265" font-size="19" fill="#e2e8f0" font-weight="800" text-anchor="start" >RMSE</text>
<text x="586" y="287" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="start" >Penalises large errors more  ·  lower is better</text>
<rect x="898" y="250" width="152" height="26" rx="13" fill="#14b8a6"/>
<text x="974" y="268" font-size="10.5" fill="#0b1220" font-weight="800" text-anchor="middle" letter-spacing="0.6">SELECTION METRIC</text>
<rect x="560" y="316" width="510" height="70" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
<rect x="560" y="316" width="6" height="70" rx="3" fill="#14b8a6"/>
<text x="586" y="347" font-size="19" fill="#e2e8f0" font-weight="800" text-anchor="start" >R² Score</text>
<text x="586" y="369" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="start" >Fit versus a mean baseline  ·  higher is better</text>
<rect x="560" y="398" width="510" height="156" rx="12" fill="#042f2e" stroke="#14b8a6" stroke-opacity="0.6"/>
<text x="586" y="428" font-size="16" fill="#99f6e4" font-weight="800" text-anchor="start" >Model selection rule</text>
<text x="586" y="456" font-size="13.5" fill="#cbd5e1" font-weight="400" text-anchor="start" >Best classifier  =  highest F1 Score on held-out data.</text>
<text x="586" y="480" font-size="13.5" fill="#cbd5e1" font-weight="400" text-anchor="start" >Best regressor  =  lowest RMSE on held-out data.</text>
<text x="586" y="504" font-size="13.5" fill="#cbd5e1" font-weight="400" text-anchor="start" >R² can be negative when a model does worse than</text>
<text x="586" y="528" font-size="13.5" fill="#cbd5e1" font-weight="400" text-anchor="start" >simply predicting the mean score.</text>
</svg>
