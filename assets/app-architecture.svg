<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="470" viewBox="0 0 1120 470" role="img" aria-labelledby="t d" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Application architecture</title>
<desc id="d">A user enters features in the Streamlit interface, they become a DataFrame, pass through the saved classification and regression pipelines and return a completion status and an estimated final score.</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
<linearGradient id="gi" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#4338ca"/></linearGradient>
<linearGradient id="gt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
<linearGradient id="ga" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#b45309"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/></filter>
</defs>
<rect width="1120" height="470" rx="18" fill="#0f172a"/>
<text x="560" y="44" font-size="24" fill="#e2e8f0" font-weight="800" text-anchor="middle" >Application Architecture</text>
<text x="560" y="68" font-size="14" fill="#94a3b8" font-weight="400" text-anchor="middle" >From user input to two predictions in a single request</text>
<rect x="24" y="190" width="140" height="90" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" filter="url(#sh)"/>
<text x="94.0" y="232.0" font-size="17" fill="#e2e8f0" font-weight="700" text-anchor="middle" >User</text>
<text x="94.0" y="252.0" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="middle" >enters features</text>
<rect x="204" y="190" width="170" height="90" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" filter="url(#sh)"/>
<text x="289.0" y="232.0" font-size="17" fill="#e2e8f0" font-weight="700" text-anchor="middle" >Streamlit UI</text>
<text x="289.0" y="252.0" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="middle" >input form + results</text>
<rect x="414" y="190" width="170" height="90" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#sh)"/>
<text x="499.0" y="232.0" font-size="15" fill="#e2e8f0" font-weight="700" text-anchor="middle" >Input DataFrame</text>
<text x="499.0" y="252.0" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="middle" >same schema as training</text>
<polyline points="164,235 204,235" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#ar)"/>
<polyline points="374,235 414,235" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#ar)"/>
<rect x="640" y="120" width="220" height="90" rx="12" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" filter="url(#sh)"/>
<text x="750.0" y="162.0" font-size="15.5" fill="#e2e8f0" font-weight="700" text-anchor="middle" >Classification pipeline</text>
<text x="750.0" y="182.0" font-size="11.5" fill="#94a3b8" font-weight="400" text-anchor="middle" >best_classification_model.joblib</text>
<rect x="640" y="260" width="220" height="90" rx="12" fill="#042f2e" stroke="#14b8a6" stroke-width="1.5" filter="url(#sh)"/>
<text x="750.0" y="302.0" font-size="15.5" fill="#e2e8f0" font-weight="700" text-anchor="middle" >Regression pipeline</text>
<text x="750.0" y="322.0" font-size="11.5" fill="#94a3b8" font-weight="400" text-anchor="middle" >best_regression_model.joblib</text>
<polyline points="584,235 612,235 612,165 640,165" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#ar)"/>
<polyline points="612,235 612,305 640,305" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#ar)"/>
<rect x="910" y="120" width="190" height="90" rx="12" fill="url(#gi)" filter="url(#sh)"/>
<text x="1005" y="156" font-size="16" fill="#ffffff" font-weight="800" text-anchor="middle" >Completion status</text>
<text x="1005" y="180" font-size="12" fill="#c7d2fe" font-weight="400" text-anchor="middle" >Completed  /  Not Completed</text>
<rect x="910" y="260" width="190" height="90" rx="12" fill="url(#gt)" filter="url(#sh)"/>
<text x="1005" y="296" font-size="16" fill="#ffffff" font-weight="800" text-anchor="middle" >Estimated score</text>
<text x="1005" y="320" font-size="12" fill="#99f6e4" font-weight="400" text-anchor="middle" >continuous value, 0 – 100</text>
<polyline points="860,165 910,165" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#ar)"/>
<polyline points="860,305 910,305" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#ar)"/>
<text x="560" y="410" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="middle" >Both pipelines bundle preprocessing with the estimator, so raw user inputs are transformed exactly as during training.</text>
<text x="560" y="432" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="middle" >Predictions are model estimates, not guaranteed outcomes.</text>
</svg>
